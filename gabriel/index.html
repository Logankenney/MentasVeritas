<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Gabriel, coming soon (Logan 2026-11-28 10:35 UTC: "make gabriel link in mentis veritas go to a coming soon page with an
     animation of gabriel and a one line text"). Kept out of search until the Gabriel site itself is published. -->
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="description" content="Gabriel, divine information from Mentis Veritas, is coming soon.">
<title>Gabriel · Coming soon · Mentis Veritas</title>
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  /* The Mentis Veritas look (black, open, unboxed) with Gabriel's own halo gold glowing faintly behind him. */
  :root {
    --bg: #000; --fg: #fff; --fg-2: #d0d0d5; --accent: #7fa6e0; --gold: #f3c969;
    --display: "Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --body: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
    background: radial-gradient(48rem 34rem at 50% 30%, rgba(243,201,105,.10), transparent 62%), radial-gradient(60rem 40rem at 50% 110%, rgba(38,34,86,.55), transparent 65%); }
  .site-header { position: sticky; top: 0; z-index: 10; background: rgba(0,0,0,.8); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); padding-top: env(safe-area-inset-top, 0px); }
  .site-header .wrap { max-width: 1024px; height: 48px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; text-decoration: none; opacity: .9; }
  .brand:hover { opacity: 1; }
  .mark { width: 22px; height: 22px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .hdr-link { font-size: 12px; color: var(--fg); opacity: .8; text-decoration: none; line-height: 48px; }
  .hdr-link:hover { opacity: 1; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2vh 20px 8vh; text-align: center; }
  .stage { position: relative; width: min(30rem, 88vw); }
  /* soft edges: the stage melts into the page, no visible box */
  canvas { width: 100%; aspect-ratio: 1; display: block; -webkit-mask-image: radial-gradient(closest-side, #000 62%, transparent 100%); mask-image: radial-gradient(closest-side, #000 62%, transparent 100%); }
  .line { font-family: var(--display); font-weight: 300; font-size: clamp(1.35rem, 4.2vw, 2.1rem); line-height: 1.25; letter-spacing: -.005em; margin: .2rem 0 0; text-wrap: balance; }
  .line em { font-style: normal; color: var(--gold); }
  .toggle { position: absolute; right: .25rem; bottom: .25rem; width: 34px; height: 34px; border-radius: 999px; border: 0; background: transparent; color: var(--fg-2); opacity: .55; cursor: pointer; display: grid; place-items: center; }
  .toggle:hover, .toggle:focus-visible { opacity: 1; color: var(--gold); outline: none; }
  .toggle:focus-visible { box-shadow: 0 0 0 1px var(--gold); }
  .toggle svg { width: 14px; height: 14px; }
  @media (prefers-reduced-motion: reduce) { .toggle { transition: none; } }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Mentis Veritas home">
      <svg class="mark" viewBox="0 0 200 200" aria-hidden="true">
        <defs><clipPath id="mv-v-small"><rect x="56" y="0" width="88" height="200"/></clipPath></defs>
        <path d="M46 158 V46 L100 128 L154 46 V158" fill="none" stroke="#ffffff" stroke-width="20" stroke-miterlimit="6"/>
        <path clip-path="url(#mv-v-small)" d="M46 158 V46 L100 128 L154 46 V158" fill="none" stroke="#7fa6e0" stroke-width="21" stroke-miterlimit="6"/>
      </svg>
      <span class="sr">Mentis Veritas</span>
    </a>
    <a class="hdr-link" href="/#products">Products</a>
  </div>
</header>

<main>
  <div class="stage">
    <!-- Gabriel, the Gabriel Mee agent (Rev 1.1), drawn live by gabriel.js: waves hello, thinks, lifts an idea orb, sounds
         the herald's trumpet, unrolls a scroll, then sends an idea up to the cloud. Pause control (WCAG 2.2.2); a still
         frame under reduced motion. -->
    <canvas id="gabriel" width="900" height="900" role="img" aria-label="Gabriel, an animated AI agent: a small wireframe herald with a halo and small wings, in an indigo lab coat with a GABRIEL · AI agent badge. He waves, thinks and lifts an orb of light."></canvas>
    <button class="toggle" id="anim-toggle" type="button" aria-pressed="false" aria-label="Pause animation">
      <svg viewBox="0 0 14 14" aria-hidden="true"><path id="anim-icon" d="M3 2h3v10H3zM8 2h3v10H8z" fill="currentColor"/></svg>
    </button>
  </div>
  <h1 class="line"><em>Gabriel</em> is coming soon: divine information from anything you bring.</h1>
</main>

<script src="gabriel.js"></script>
<script src="stage.js"></script>
</body>
</html>
