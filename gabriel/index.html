  html, body { margin: 0; height: 100%; background: #0a0c24; color: #fffaee; overflow: hidden; }
  header { position: relative; height: 100vh; height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }

       letter-spacing: .02em; text-shadow: 0 0 24px rgba(243, 201, 105, .35); }

<body>
<header>
  <canvas id="stage" role="img" aria-label="Gabriel, an animated AI agent from Mentis Veritas: a small herald with a halo and feathered wings, playing through his moves."></canvas>
  <h1>Coming soon</h1>
</header>
<script src="gabriel.js"></script>
<script>
// Temporary Gabriel landing page (Logan 2026-11-28 11:25 UTC): Mee Gabriel acting playfully in the header; "Coming soon" is the only text.
(function () {
  var cv = document.getElementById('stage'), ctx = cv.getContext('2d');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // a playful loop: each beat is one move; he hops into some, drifts side to side, and works up a storm in the halo once a loop
  var BEATS = [
    { right: 'wave', d: 3.2, hop: 1 }, { right: 'point', d: 2.4 }, { right: 'herald', d: 3.2, hop: 1 },
    { right: 'vision', d: 4.4 }, { right: 'scroll', d: 3.6 }, { right: 'down', d: 3.4, load: 1 },
    { right: 'thumb', d: 3.2, hop: 1 }, { right: 'wave', d: 2.4, spin: 1 }
  ];
  var LOOP = BEATS.reduce(function (s, b) { return s + b.d; }, 0);
  function beat(t) { var lt = t % LOOP; for (var i = 0; i < BEATS.length; i++) { if (lt < BEATS[i].d) return { b: BEATS[i], u: lt / BEATS[i].d, lt: lt }; lt -= BEATS[i].d; } return { b: BEATS[0], u: 0, lt: 0 }; }
  function heaven(w, h, t) {   // very light heavenly touches, his page only
    var g = ctx.createRadialGradient(w * .5, -h * .1, 0, w * .5, -h * .1, h * .95); g.addColorStop(0, 'rgba(255,246,226,.08)'); g.addColorStop(1, 'rgba(255,246,226,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 5; i++) { var x = w * (.2 + i * .15), sw = w * .05; ctx.beginPath(); ctx.moveTo(x - sw * .3, 0); ctx.lineTo(x + sw * .3, 0);
      ctx.lineTo(x + sw + (i - 2) * w * .04, h * .8); ctx.lineTo(x - sw + (i - 2) * w * .04, h * .8); ctx.closePath();
      ctx.fillStyle = 'rgba(255,246,226,' + (.016 + .012 * Math.sin(t * .4 + i * 1.3)) + ')'; ctx.fill(); }
    for (var m = 0; m < 14; m++) { var u = (t * .025 + m / 14) % 1, mx = w * ((m * .37) % 1), my = h * (.85 - u * .8);
      ctx.beginPath(); ctx.arc(mx + Math.sin(t * .5 + m) * 10, my, 1.5 + (m % 3) * .7, 0, 6.283); ctx.fillStyle = 'rgba(255,240,200,' + (.25 * Math.sin(u * Math.PI)) + ')'; ctx.fill(); }
  }
  function frame(t) {
    var dpr = Math.min(2, window.devicePixelRatio || 1), w = cv.clientWidth * dpr, h = cv.clientHeight * dpr;
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, w, h); heaven(w, h, t);
    var B = beat(t), b = B.b, u = B.u;
    var sc = Math.min(w / 440, h / 470) * (w < h ? 1.05 : 1);
    var drift = Math.sin(t * .35) * Math.min(w * .12, 120 * dpr);
    var hop = b.hop ? Math.max(0, Math.sin(Math.min(1, u * 2.2) * Math.PI)) * 26 : 0;
    var bob = Math.sin(t * 2.2) * 4, lean = Math.sin(t * .9) * .04 + (b.spin ? Math.sin(u * Math.PI * 2) * .12 : 0);
    var load = b.load ? Math.min(1, Math.sin(u * Math.PI) * 1.25) : .12 + .06 * Math.sin(t * .7);
    ctx.save(); ctx.translate(w / 2 + drift, h * .64 - (hop + bob) * sc / 1.4); ctx.rotate(lean); ctx.scale(sc, sc);
    MeeGabriel.draw(ctx, reduce ? 3.3 : B.lt + 3, 1, { left: 'down', right: b.right, bubble: false, load: load, sparkles: true });
    ctx.restore();
  }
  if (reduce) { frame(9); window.addEventListener('resize', function () { frame(9); }); return; }
  var t0 = null; (function tick(now) { if (t0 == null) t0 = now; frame((now - t0) / 1000); requestAnimationFrame(tick); })(performance.now());
})();
</script>
